<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokédix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --page: #eef1f5;
  --card: #ffffff;
  --ink: #17202e;
  --ink-2: #4b586b;
  --muted: #6e7a8c;
  --line: #d9dfe7;
  --red: #d93a2b;
  --red-text: #b52a1d;
  --mask: #2c3a52;
  --mask-fg: #c9d3e2;
  --found: #ffe27a;
  --h1: #9aa7ba;
  --h2: #d9a441;
  --h3: #e0702a;
  --h4: #d93a2b;
  --near-fg: #ffffff;
  --sans: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f141c; --card: #171e29; --ink: #e6ebf2; --ink-2: #aab5c4; --muted: #8592a4; --line: #283244;
    --red: #e5503f; --red-text: #ff8a7a; --mask: #3a4a66; --mask-fg: #9fb0c9; --found: #6b5a12;
    --h1: #5e6b80; --h2: #9c7425; --h3: #b2561c; --h4: #c23a2b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f141c; --card: #171e29; --ink: #e6ebf2; --ink-2: #aab5c4; --muted: #8592a4; --line: #283244;
  --red: #e5503f; --red-text: #ff8a7a; --mask: #3a4a66; --mask-fg: #9fb0c9; --found: #6b5a12;
  --h1: #5e6b80; --h2: #9c7425; --h3: #b2561c; --h4: #c23a2b;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* En-tête */
.top { background: var(--card); border-bottom: 3px solid var(--red); }
.top-in { max-width: 1160px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.ball { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ink); position: relative; overflow: hidden;
  background: linear-gradient(var(--red) 0 46%, var(--ink) 46% 56%, var(--card) 56%); flex: none; }
.ball::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%);
  border-radius: 50%; background: var(--card); border: 3px solid var(--ink); }
.brand h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
.when { display: flex; flex-direction: column; line-height: 1.2; }
.when strong { font-weight: 600; font-size: 0.95rem; }
.when span { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.nav { margin-left: auto; display: flex; gap: 4px; }
.nav button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.nav button:hover { border-color: var(--ink-2); }

/* Mise en page */
main { max-width: 1160px; margin: 0 auto; padding: 18px 20px 40px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px 12px 32px; } .rail { order: -1; } }

/* Saisie */
.rail, main > section { min-width: 0; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 860px) { .rail { position: static; } .guess { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; } }
.guess { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.guess form { display: flex; gap: 8px; }
.guess input { flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--page); font-size: 1.05rem; }
.guess input:focus { border-color: var(--red); outline: none; }
.go { border: none; border-radius: 10px; background: var(--red); color: #fff; font-weight: 700; padding: 0 16px; cursor: pointer; }
.go:disabled, .guess input:disabled { opacity: 0.5; cursor: default; }
.fb { min-height: 1.4em; margin: 8px 2px 0; font-size: 0.92rem; color: var(--ink-2); }
.fb b { color: var(--ink); }

.hist-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.hist-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.hist-h h2 { margin: 0; font-size: 1rem; font-weight: 700; }
.hist-h h2 span { color: var(--muted); font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; background: none; padding: 3px 9px; font-size: 0.82rem; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.hist { list-style: none; margin: 0; padding: 0; max-height: 52vh; overflow-y: auto; }
@media (max-width: 860px) { .hist { max-height: 30vh; } }
.hist li { display: grid; grid-template-columns: 2.4em 1fr auto; gap: 6px; align-items: center; padding: 4px 2px; border-top: 1px solid var(--line); font-size: 0.95rem; }
.hist li:first-child { border-top: none; }
.hist .n { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.hist .w { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .r { font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.hist .r.hit { color: var(--ink); font-weight: 700; }
.hist .r.miss { color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; background: var(--line); }
.dot.h1 { background: var(--h1); } .dot.h2 { background: var(--h2); } .dot.h3 { background: var(--h3); } .dot.h4 { background: var(--h4); }
.hist li.last { background: color-mix(in srgb, var(--found) 45%, transparent); border-radius: 6px; }
.empty { color: var(--muted); font-size: 0.9rem; margin: 4px 0; }

/* Article */
.doc-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px 18px; }
@media (max-width: 560px) { .doc-wrap { padding: 16px 14px; } }
.kind[hidden] { display: none; }
.kind { display: inline-block; font-size: 0.82rem; font-weight: 600; color: var(--red-text); border: 1px solid currentColor; border-radius: 999px; padding: 1px 10px; margin-bottom: 10px; }
.doc { font-family: var(--serif); font-size: 1.06rem; line-height: 1.85; max-width: 72ch; }
.doc h2 { font-family: var(--sans); font-size: 2rem; line-height: 1.5; margin: 0 0 14px; font-weight: 800; letter-spacing: -0.01em; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.doc p { margin: 0 0 14px; }
.wd { border-radius: 4px; }
.m { display: inline-block; background: var(--mask); color: transparent; border-radius: 4px; height: 1.15em; vertical-align: -0.18em; position: relative; cursor: pointer; user-select: none; }
.doc h2 .m { height: 0.95em; vertical-align: -0.08em; }
.m.near { color: var(--near-fg); font-family: var(--sans); font-size: 0.78em; line-height: 1.5em; height: 1.45em; vertical-align: 0.02em; text-align: center; overflow: hidden; white-space: nowrap; padding: 0 2px; }
.doc h2 .m.near { font-size: 0.5em; line-height: 1.9em; height: 1.9em; vertical-align: 0.25em; }
.m.h1 { background: var(--h1); } .m.h2 { background: var(--h2); } .m.h3 { background: var(--h3); } .m.h4 { background: var(--h4); }
.m .len { position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); background: var(--ink); color: var(--card); font-family: var(--sans); font-size: 0.75rem; line-height: 1.3; padding: 2px 6px; border-radius: 5px; white-space: nowrap; pointer-events: none; }
.f-new { background: var(--found); transition: background-color 1.6s ease; }
.shown { color: var(--muted); }
.doc-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; font-size: 0.9rem; color: var(--muted); }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--ink-2); font-size: 0.88rem; }
.ghost:hover { border-color: var(--ink-2); color: var(--ink); }

/* Fin de partie */
.win { background: var(--card); border: 2px solid var(--red); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
.win h3 { margin: 0 0 4px; font-size: 1.3rem; font-weight: 800; }
.win p { margin: 4px 0; color: var(--ink-2); }
.win a { color: var(--red-text); font-weight: 600; }
.win .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.win .acts button { border: none; border-radius: 9px; background: var(--ink); color: var(--card); padding: 7px 14px; cursor: pointer; font-weight: 600; }

/* Dialogue */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; max-width: min(560px, 92vw); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(10, 14, 20, 0.5); }
.dlg-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 0; }
.dlg-h h2 { margin: 0; font-size: 1.2rem; }
.dlg-h button { background: none; border: none; font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 2px 6px; }
.dlg-b { padding: 6px 18px 18px; font-size: 0.97rem; }
.dlg-b p { margin: 8px 0; }
.dlg-b ul { padding-left: 1.2em; margin: 6px 0; }
.dlg-b a { color: var(--red-text); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.chip { font-size: 0.82rem; border-radius: 6px; padding: 1px 8px; color: #fff; }
.gate { position: fixed; inset: 0; z-index: 50; background: var(--page); display: flex; align-items: center; justify-content: center; padding: 20px; }
.gate[hidden] { display: none; }
.gate-box { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--red); border-radius: 14px; padding: 22px; width: min(360px, 100%); }
.gate-box h2 { margin: 0 0 4px; font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.gate-box p { margin: 4px 0 14px; color: var(--ink-2); font-size: 0.95rem; }
.gate-box form { display: flex; gap: 8px; }
.gate-box input { flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--page); }
.gate-box input:focus { border-color: var(--red); outline: none; }
.gate-msg { min-height: 1.3em; color: var(--red-text); font-size: 0.9rem; margin: 8px 0 0 !important; }
footer { max-width: 1160px; margin: 0 auto; padding: 0 20px 28px; color: var(--muted); font-size: 0.82rem; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { .f-new { transition: none; } }
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gate-box">
    <h2><span class="ball" aria-hidden="true"></span>Pokédix</h2>
    <p>Ce jeu est réservé aux invités. Entrez le mot de passe pour jouer.</p>
    <form id="gateForm" autocomplete="off">
      <input id="gateIn" type="password" placeholder="Mot de passe" aria-label="Mot de passe">
      <button class="go" type="submit">Entrer</button>
    </form>
    <p class="gate-msg" id="gateMsg" aria-live="polite"></p>
  </div>
</div>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="ball" aria-hidden="true"></span><h1>Pokédix</h1></div>
    <div class="when"><strong id="num">Page n°1</strong><span id="next"></span></div>
    <nav class="nav" aria-label="Aide">
      <button type="button" id="bRules">Règles</button>
      <button type="button" id="bPast">Pages passées</button>
    </nav>
  </div>
</header>
<main>
  <section aria-label="Page mystère">
    <div id="end"></div>
    <div class="doc-wrap">
      <span class="kind" id="kind" hidden></span>
      <article class="doc" id="doc"></article>
      <div class="doc-foot">
        <span id="prog"></span>
        <button type="button" class="ghost" id="bGive">Abandonner et révéler la page</button>
      </div>
    </div>
  </section>
  <aside class="rail">
    <div class="guess">
      <form id="form" autocomplete="off">
        <label for="q" class="sr" style="position:absolute;left:-9999px">Proposer un mot</label>
        <input id="q" type="text" placeholder="Proposer un mot" autocapitalize="off" spellcheck="false" enterkeyhint="send">
        <button class="go" id="go" type="submit">Essayer</button>
      </form>
      <p class="fb" id="fb" aria-live="polite"></p>
    </div>
    <div class="hist-box">
      <div class="hist-h">
        <h2>Essais<span id="cnt">0</span></h2>
        <div class="seg" role="group" aria-label="Trier les essais">
          <button type="button" data-sort="recent" aria-pressed="true">Récents</button>
          <button type="button" data-sort="near" aria-pressed="false">Proches</button>
        </div>
      </div>
      <ol class="hist" id="hist"></ol>
    </div>
  </aside>
</main>
<footer>Textes extraits et adaptés de <a href="https://www.pokepedia.fr/" target="_blank" rel="noopener">Poképédia</a>, sous licence CC BY-NC-SA 3.0. Jeu non officiel, inspiré de Pédantix. Pokémon est une marque de Nintendo, Creatures et Game Freak.</footer>
<dialog id="dlg"><div class="dlg-h"><h2 id="dlgT"></h2><button type="button" id="dlgX" aria-label="Fermer">×</button></div><div class="dlg-b" id="dlgB"></div></dialog>
<script>
/* PokéPédantix — moteur du jeu (logique pure, testable sous Node) */
var TX = (function () {
  "use strict";

  /* ---------- Normalisation ---------- */
  var LETTER = /[A-Za-zÀ-ÖØ-öø-ÿŒœÆæ0-9]/;
  var ELIDABLE = new Set(["l", "d", "n", "s", "c", "j", "m", "t", "qu", "jusqu", "lorsqu", "puisqu", "quoiqu", "presqu"]);
  var COMPOUND_APOS = new Set(["aujourd'hui", "prud'homme", "presqu'île", "cramois'île"]);
  var ALIAS = {};

  function low(s) { return String(s).toLowerCase().replace(/[’`´]/g, "'"); }
  function stripAcc(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/œ/g, "oe").replace(/æ/g, "ae");
  }
  function isNum(s) { return /^\d+$/.test(s); }

  /* ---------- Découpage du texte ---------- */
  function tokenize(text) {
    var out = [], i = 0, n = text.length;
    while (i < n) {
      var ch = text[i];
      if (LETTER.test(ch)) {
        var j = i;
        while (j < n && (LETTER.test(text[j]) || (text[j] === "&" && j + 1 < n && LETTER.test(text[j + 1]) && j > i))) j++;
        var word = text.slice(i, j);
        if (j < n && (text[j] === "'" || text[j] === "’")) {
          var k = j + 1;
          while (k < n && LETTER.test(text[k])) k++;
          var tail = text.slice(j + 1, k);
          if (tail && COMPOUND_APOS.has(low(word + "'" + tail))) { word = text.slice(i, k); j = k; }
          else if (ELIDABLE.has(low(word))) { word = text.slice(i, j + 1); j = j + 1; }
        }
        out.push({ w: true, s: word });
        i = j;
      } else {
        var m = i;
        while (m < n && !LETTER.test(text[m])) m++;
        out.push({ w: false, s: text.slice(i, m) });
        i = m;
      }
    }
    return out;
  }

  /* ---------- Mots-outils (jamais regroupés entre eux) ---------- */
  var FUNC = new Set(("le la les l' un une des du de d' et ou où à au aux en dans par pour sur sous avec sans chez vers " +
    "entre contre selon depuis pendant durant avant après dès jusqu' jusque lors lorsque lorsqu' quand comme si ainsi aussi " +
    "alors donc mais or ni car puis ce cet cette ces c' ceci cela ça se s' sa son ses notre nos votre vos mon ma mes ton ta tes " +
    "il ils elle elles on nous vous je j' tu me m' te t' lui y ne n' pas plus moins très qui que qu' quoi dont chaque " +
    "non oui déjà encore toujours jamais souvent parfois bien peu trop beaucoup tant autant afin grâce parmi via là ici etc " +
    "puisqu' quoiqu' presqu' tandis cependant pourtant enfin ensuite également notamment surtout seulement simplement").split(" "));

  /* Formes irrégulières ou à garder distinctes (nom ≠ verbe) */
  var IRREG = {};
  function addIrreg(str) {
    str.split(";").forEach(function (grp) {
      grp = grp.trim(); if (!grp) return;
      var p = grp.split(":"), lemma = p[0].trim();
      p[1].trim().split(/\s+/).forEach(function (f) { IRREG[f] = lemma; });
      IRREG[lemma] = lemma;
    });
  }
  addIrreg("nouveau: nouvelle nouvelles nouvel nouveaux; beau: belle belles bel beaux; vieux: vieille vieilles vieil;" +
    "tout: tous toute toutes; quel: quelle quels quelles; même: mêmes; autre: autres; leur: leurs; certain: certaine certains certaines;" +
    "aucun: aucune aucuns aucunes; tel: telle tels telles; plusieurs: plusieurs; entreprise: entreprises; produit: produits;" +
    "contenant: contenants; contenu: contenus; compromis: compromis; devant: devant; matériau: matériaux; métal: métaux;" +
    "international: internationale internationales internationaux; principal: principale principales principaux;" +
    "environnemental: environnementale environnementales environnementaux; normal: normale normales normaux;" +
    "partie: parties; marque: marques; spécial: spéciale spéciales spéciaux; social: sociale sociales sociaux; global: globale globales globaux;" +
    "fondamental: fondamentale fondamentales fondamentaux; mondial: mondiale mondiales mondiaux; local: locale locales locaux;" +
    "travail: travaux; animal: animaux; idéal: idéale idéales idéaux; vertical: verticale verticales verticaux;" +
    "familial: familiale familiales familiaux; industriel: industrielle industrielles industriels; essentiel: essentielle essentielles essentiels;" +
    "naturel: naturelle naturelles naturels; individuel: individuelle individuelles individuels; potentiel: potentielle potentielles potentiels;" +
    "frais: fraîche fraîches; doux: douce douces; long: longue longues longs; public: publique publiques publics;" +
    "fin: fine fines fins; pur: pure pures purs; sûr: sûre sûres sûrs; dur: dure dures durs; nu: nue nues nus; mat: mate mats mates;" +
    "bon: bonne bonnes bons; gros: grosse grosses; bas: basse basses; épais: épaisse épaisses; suivant: suivante suivantes suivants; mesure: mesures; usage: usages; service: services; recherche: recherches");

  /* ---------- Conjugaison (formes -> infinitif) ---------- */
  var VERB = {};
  function put(forms, lemma) { forms.forEach(function (f) { if (f && !(f in VERB)) VERB[f] = lemma; }); }

  function conjER(inf) {
    var st = inf.slice(0, -2), soft = st, forms = [];
    var last = st.slice(-1);
    if (last === "c") soft = st.slice(0, -1) + "ç";
    if (last === "g") soft = st + "e";
    var stE = st; // radical devant e muet
    var mAcc = st.match(/^(.*)é([^aeiouyéèêàâîïôûù]+)$/);
    var mE = st.match(/^(.*)e([^aeiouyéèêàâîïôûù])$/);
    if (mAcc) stE = mAcc[1] + "è" + mAcc[2];
    else if (mE && !/[aeiou]$/.test(mE[1])) stE = mE[1] + "è" + mE[2];
    if (/[aou]y$/.test(st)) stE = st.slice(0, -1) + "i";
    var A = function (e) { return (/^[ao]/.test(e) ? soft : st) + e; };
    ["e", "es", "ent"].forEach(function (e) { forms.push(stE + e, st + e); });
    ["ons"].forEach(function (e) { forms.push(A(e)); });
    ["ez", "er", "é", "ée", "és", "ées", "èrent", "ions", "iez"].forEach(function (e) { forms.push(st + e); });
    ["ais", "ait", "aient", "ant", "a", "as", "ai", "âmes", "âtes", "asse", "assent"].forEach(function (e) { forms.push(A(e)); });
    ["erai", "eras", "era", "erons", "erez", "eront", "erais", "erait", "erions", "eriez", "eraient"].forEach(function (e) {
      forms.push(st + e, stE + e);
    });
    put(forms, inf);
  }
  function conjIR(inf) {
    var st = inf.slice(0, -2);
    put(["ir", "is", "it", "issons", "issez", "issent", "issais", "issait", "issions", "issiez", "issaient", "irai", "iras", "ira",
      "irons", "irez", "iront", "irais", "irait", "irions", "iriez", "iraient", "irent", "isse", "isses", "issant", "i", "ie", "ies"]
      .map(function (e) { return st + e; }), inf);
  }

  function api(params) {
    var q = Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
    return fetch(API + "?" + q + "&format=json&formatversion=2&origin=*").then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function category(cat) {
    var out = [], calls = 0;
    function step(cont) {
      var p = { action: "query", list: "categorymembers", cmtitle: "Catégorie:" + cat, cmlimit: "500", cmnamespace: "0", cmtype: "page" };
      if (cont) p.cmcontinue = cont;
      return api(p).then(function (d) {
        (d.query && d.query.categorymembers || []).forEach(function (m) { out.push(m.title); });
        calls++;
        if (d["continue"] && d["continue"].cmcontinue && calls < 6) return step(d["continue"].cmcontinue);
        return out;
      });
    }
    return step(null).then(function (r) { return r; }, function () { return null; });
  }
  function getPool() {
    if (!LIVE || !window.fetch) return Promise.resolve(null);
    var c = readLS("pool", null);
    if (c && c.t > Date.now() - 7 * 86400000 && c.list.length > 50) return Promise.resolve(c.list);
    return Promise.all(CATEGORIES.map(function (c) {
      return category(c[0]).then(function (titles) { return titles ? titles.map(function (t) { return [t, c[1]]; }) : null; });
    })).then(function (parts) {
      var complete = parts.every(function (p) { return p !== null; });
      parts = parts.map(function (p) { return p || []; });
      var seen = {}, list = [];
      parts.forEach(function (p) { p.forEach(function (e) {
        if (seen[e[0]] || /\//.test(e[0]) || /^Liste /.test(e[0])) return;
        seen[e[0]] = 1; list.push(e);
      }); });
      list.sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
      // On ne garde la liste que si toutes les catégories ont répondu : sinon on réessaiera au prochain chargement.
      if (complete && list.length > 50) writeLS("pool", { t: Date.now(), list: list });
      return list.length > 50 ? list : null;
    }).catch(function () { return null; });
  }
  function fetchPage(title, kind) {
    return api({ action: "parse", page: title, prop: "text", redirects: "1", disablelimitreport: "1" }).then(function (d) {
      if (!d.parse || !d.parse.text) throw new Error("page vide");
      var doc = new DOMParser().parseFromString(d.parse.text, "text/html");
      doc.querySelectorAll("sup, .mw-editsection, style, script, table, .reference").forEach(function (e) { e.remove(); });
      var paras = [], words = 0;
      doc.querySelectorAll(".mw-parser-output > p, .mw-parser-output > ul > li").forEach(function (p) {
        if (words > 260 || paras.length >= 7) return;
        var t = p.textContent.replace(/\[\d+\]/g, "").replace(/\s+/g, " ").trim();
        if (t.length < 25) return;
        paras.push(t); words += t.split(" ").length;
      });
      if (words < 45) throw new Error("page trop courte");
      var t = d.parse.title;
      return { id: t, title: t, kind: kind, paras: paras, url: "https://www.pokepedia.fr/" + encodeURIComponent(t.replace(/ /g, "_")) };
    });
  }
  function hash32(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
    return h >>> 0;
  }
  function livePuzzle(n, pool) {
    var cached = readLS("puz." + n, null);
    if (cached) return Promise.resolve(cached);
    // Chaque page reçoit une note qui ne dépend que de son titre et du numéro du jour.
    // On prend les meilleures notes : l'ordre ou la taille de la liste n'y changent rien.
    var ranked = pool.map(function (e) { return { e: e, h: hash32(n + "|" + e[0]) }; })
      .sort(function (a, b) { return a.h - b.h || (a.e[0] < b.e[0] ? -1 : 1); }).slice(0, 8);
    var tries = 0;
    function attempt() {
      var e = ranked[tries].e;
      tries++;
      return fetchPage(e[0], e[1]).catch(function (err) { if (tries < ranked.length) return attempt(); throw err; });
    }
    return attempt().then(function (p) { writeLS("puz." + n, p); return p; });
  }
  function puzzleFor(n) {
    var fallback = function () { return PAGES[pageFor(n)]; };
    if (!S.pool) return Promise.resolve(fallback());
    return livePuzzle(n, S.pool).catch(fallback);
  }

  function load(n) {
    var tok = ++S.token;
    S.n = n;
    $("doc").innerHTML = '<p class="empty">Chargement de la page…</p>';
    $("q").disabled = true; $("go").disabled = true;
    return puzzleFor(n).then(function (puzzle) { if (tok === S.token) start(n, puzzle); });
  }
  function start(n, puzzle) {
    S.game = new TX.Game(puzzle);
    S.saved = readLS("p." + n, null);
    // Partie enregistrée sur une autre page (ex. page de secours) : on repart de zéro.
    if (!S.saved || (S.saved.id && S.saved.id !== puzzle.id)) S.saved = { guesses: [], ab: false };
    S.saved.id = puzzle.id;
    S.lastFound = new Set(); S.lastG = null; S.openLen = null;
    S.saved.guesses.forEach(function (w) { var r = S.game.propose(w); if (r.status === "ok") S.lastG = r.g; });
    S.ended = S.game.won || S.saved.ab;
    if (S.saved.ab) S.game.revealAll();
    $("q").value = "";
    setFb(S.ended ? "" : (S.game.guesses.length ? "" : "Astuce : commencez par des petits mots (« le », « de », « est »), puis des mots de l’univers Pokémon (« type », « génération », « capacité »)."));
    $("q").disabled = S.ended; $("go").disabled = S.ended; $("bGive").hidden = S.ended;
    renderAll();
    if (!S.ended && window.matchMedia("(pointer: fine)").matches) $("q").focus({ preventScroll: true });
  }
  function save() {
    S.saved.won = S.game.won; S.saved.wonAt = S.game.wonAt; S.saved.n = S.game.count();
    writeLS("p." + S.n, S.saved);
  }
  function setFb(html) { $("fb").innerHTML = html; }

  function renderAll() { renderHeader(); renderDoc(); renderHist(); renderEnd(); }

  function renderHeader() {
    $("num").textContent = "Page n°" + S.n + (S.n !== S.today ? " (passée)" : "");
    var k = $("kind");
    if (S.ended) { k.hidden = false; k.textContent = S.game.puzzle.kind; } else k.hidden = true;
  }

  function wordHTML(w) {
    if (w.found || w.shown) {
      var cls = "wd" + (S.lastFound.has(w.i) ? " f-new" : "") + (w.shown && !w.found ? " shown" : "");
      return '<span class="' + cls + '" data-i="' + w.i + '">' + esc(disp(w.s)) + "</span>";
    }
    var width = (w.len * 0.62 + 0.3).toFixed(2) + "em";
    var len = S.openLen === w.i ? '<span class="len">' + plural(w.len, "lettre", "lettres") + "</span>" : "";
    if (w.best && w.best.score >= 0.3) {
      var h = TX.heat(w.best.score);
      return '<span class="m near h' + h + '" data-i="' + w.i + '" style="min-width:' + width + '" title="' + HEAT[h] + '">' + esc(disp(w.best.g)) + len + "</span>";
    }
    return '<span class="m" data-i="' + w.i + '" style="width:' + width + '">' + len + "</span>";
  }
  function renderDoc() {
    var html = "";
    S.game.blocks.forEach(function (b) {
      var inner = b.toks.map(function (t) { return t.w ? wordHTML(t) : esc(disp(t.s)); }).join("");
      html += b.kind === "title" ? "<h2>" + inner + "</h2>" : "<p>" + inner + "</p>";
    });
    $("doc").innerHTML = html;
    var g = S.game, tot = g.words.length, f = g.words.filter(function (w) { return w.found; }).length;
    $("prog").textContent = plural(f, "mot trouvé", "mots trouvés") + " sur " + tot + " (" + Math.round(100 * f / tot) + " %)";
    if (S.lastFound.size) setTimeout(function () {
      document.querySelectorAll(".f-new").forEach(function (el) { el.classList.remove("f-new"); });
    }, 900);
  }
  function renderHist() {
    var list = S.game.guesses.slice();
    if (S.sort === "recent") list.reverse();
    else list.sort(function (a, b) { return (b.found > 0) - (a.found > 0) || (b.best || 0) - (a.best || 0); });
    $("cnt").textContent = S.game.count();
    if (!list.length) { $("hist").innerHTML = '<li class="empty" style="display:block">Vos mots apparaîtront ici.</li>'; return; }
    $("hist").innerHTML = list.map(function (e) {
      var r, cls;
      if (e.total) { r = e.found ? "+" + e.found : "déjà vu"; cls = "hit"; }
      else { var h = TX.heat(e.best || 0); r = '<span class="dot h' + h + '"></span>' + (h ? HEAT[h] : "absent"); cls = "miss"; }
      return '<li' + (e.g === S.lastG ? ' class="last"' : "") + '><span class="n">' + e.n + '</span><span class="w">' + esc(disp(e.g)) + '</span><span class="r ' + cls + '">' + r + "</span></li>";
    }).join("");
  }
  function renderEnd() {
    var g = S.game, el = $("end");
    if (!S.ended) { el.innerHTML = ""; return; }
    var p = g.puzzle, link = '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">Lire « ' + esc(disp(p.title)) + " » sur Poképédia</a>";
    if (g.won) {
      el.innerHTML = '<div class="win"><h3>Trouvé : ' + esc(disp(p.title)) + "</h3><p>Vous avez trouvé la page n°" + S.n + " en " + plural(g.wonAt, "coup", "coups") + ".</p><p>" + link + '</p><div class="acts"><button type="button" id="bShare">Copier mon résultat</button><button type="button" id="bReveal">Révéler toute la page</button></div></div>';
      $("bShare").onclick = share;
      $("bReveal").onclick = function () { g.revealAll(); renderDoc(); this.remove(); };
    } else {
      el.innerHTML = '<div class="win"><h3>C’était : ' + esc(disp(p.title)) + "</h3><p>Page révélée après " + plural(g.count(), "essai", "essais") + ". Une nouvelle page arrive chaque jour à midi.</p><p>" + link + "</p></div>";
    }
  }
  function share() {
    var g = S.game, f = g.words.filter(function (w) { return w.found; }).length;
    var txt = "J’ai trouvé la page n°" + S.n + " de Pokédix en " + plural(g.wonAt, "coup", "coups") + " (" + Math.round(100 * f / g.words.length) + " % de la page dévoilée).";
    var done = function () { $("bShare").textContent = "Résultat copié"; };
    try { navigator.clipboard.writeText(txt).then(done, function () { prompt("Copiez ce texte :", txt); }); }
    catch (e) { prompt("Copiez ce texte :", txt); }
  }

  /* Proposition */
  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (S.ended) return;
    var v = $("q").value;
    if (!v.trim()) return;
    var words = v.trim().split(/\s+/);
    if (words.length > 1) { setFb("Un seul mot à la fois."); return; }
    var r = S.game.propose(v);
    if (r.status === "invalid") { setFb(esc(r.message)); return; }
    $("q").value = "";
    if (r.status === "dup") { S.lastG = r.g; S.lastFound = new Set(); setFb("« <b>" + esc(disp(r.g)) + "</b> » a déjà été proposé."); renderHist(); return; }
    S.saved.guesses.push(r.g); S.lastG = r.g; S.lastFound = new Set(r.found);
    var e = r.entry;
    if (r.found.length) setFb("« <b>" + esc(disp(r.g)) + "</b> » : " + plural(r.found.length, "mot dévoilé", "mots dévoilés") + ".");
    else if (r.already) setFb("« <b>" + esc(disp(r.g)) + "</b> » est déjà dévoilé.");
    else if ((e.best || 0) >= 0.3) setFb("« <b>" + esc(disp(r.g)) + "</b> » n’est pas dans la page, mais " + plural(e.nearCount, "mot s’en rapproche", "mots s’en rapprochent") + " (" + HEAT[TX.heat(e.best)] + ").");
    else setFb("« <b>" + esc(disp(r.g)) + "</b> » n’est pas dans la page.");
    if (r.win) { S.ended = true; $("q").disabled = true; $("go").disabled = true; $("bGive").hidden = true; setFb("Bravo !"); }
    save();
    renderAll();
    if (r.win) window.scrollTo({ top: 0, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });

  $("doc").addEventListener("click", function (ev) {
    var m = ev.target.closest(".m");
    if (!m) return;
    var i = +m.getAttribute("data-i");
    S.openLen = S.openLen === i ? null : i;
    S.lastFound = new Set();
    renderDoc();
  });
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      S.sort = b.getAttribute("data-sort");
      document.querySelectorAll(".seg button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      renderHist();
    });
  });
  $("bGive").addEventListener("click", function () {
    if (!confirm("Révéler la page et terminer la partie ?")) return;
    S.saved.ab = true; save();
    S.ended = true; S.game.revealAll();
    $("q").disabled = true; $("go").disabled = true; $("bGive").hidden = true; setFb("");
    renderAll();
  });

  /* Dialogues */
  function openDlg(title, html) { $("dlgT").textContent = title; $("dlgB").innerHTML = html; $("dlg").showModal(); }
  $("dlgX").addEventListener("click", function () { $("dlg").close(); });
  $("dlg").addEventListener("click", function (ev) { if (ev.target === $("dlg")) $("dlg").close(); });
  function rules() {
    openDlg("Comment jouer", "<p>Chaque jour à midi, une page de Poképédia est cachée : Pokémon, attaque, talent, objet, lieu, personnage, jeu… Retrouvez son titre en proposant des mots, un à la fois.</p>" +
      "<ul><li>Si le mot est dans la page, il se dévoile partout où il apparaît (pluriels et conjugaisons compris).</li>" +
      "<li>Sinon, les mots cachés qui s’en rapprochent affichent votre proposition, avec une couleur selon la proximité :</li></ul>" +
      '<div class="chips"><span class="chip" style="background:var(--h1)">froid</span><span class="chip" style="background:var(--h2)">tiède</span><span class="chip" style="background:var(--h3)">chaud</span><span class="chip" style="background:var(--h4)">brûlant</span></div>' +
      "<p>Touchez un mot caché pour voir son nombre de lettres. La partie est gagnée quand tous les mots du titre sont trouvés.</p>" +
      "<p>Votre progression reste enregistrée sur cet appareil.</p>");
  }
  $("bRules").addEventListener("click", rules);
  $("bPast").addEventListener("click", function () {
    var items = "";
    for (var n = S.today; n >= Math.max(1, S.today - 30); n--) {
      var sv = readLS("p." + n, null), st = "à jouer";
      if (sv) st = sv.won ? "trouvée en " + plural(sv.wonAt, "coup", "coups") : sv.ab ? "abandonnée" : plural(sv.n || sv.guesses.length, "essai", "essais");
      items += '<li><a href="#" data-n="' + n + '">Page n°' + n + (n === S.today ? " (aujourd’hui)" : "") + "</a> : " + st + "</li>";
    }
    openDlg("Pages passées", "<ul>" + items + "</ul>");
    $("dlgB").querySelectorAll("a[data-n]").forEach(function (a) {
      a.addEventListener("click", function (ev) { ev.preventDefault(); $("dlg").close(); load(+a.getAttribute("data-n")); });
    });
  });

  /* Compte à rebours */
  function tick() {
    var s = TX.secondsToNext(new Date());
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    $("next").textContent = "Prochaine page dans " + h + " h " + String(m).padStart(2, "0") + " min " + String(sec).padStart(2, "0") + " s";
    var t = TX.dayNumber(new Date());
    if (t !== S.today && S.game) { var wasToday = S.n === S.today; S.today = t; if (wasToday) load(t); else renderHeader(); }
  }
  function boot() {
    $("gate").hidden = true;
    tick(); setInterval(tick, 1000);
    if (!readLS("seen", false)) { writeLS("seen", true); rules(); }
    getPool().then(function (pool) { S.pool = pool; return load(S.today); });
  }
  function sha256(txt) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)).then(function (b) {
      return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
    });
  }
  if (readLS("ok", "") === MDP_SHA256) boot();
  else {
    $("gate").hidden = false;
    $("gateForm").addEventListener("submit", function (ev) {
      ev.preventDefault();
      sha256($("gateIn").value.trim()).then(function (h) {
        if (h === MDP_SHA256) { writeLS("ok", h); boot(); }
        else { $("gateMsg").textContent = "Mot de passe incorrect."; $("gateIn").select(); }
      });
    });
    $("gateIn").focus();
  }
})();

</script>
</body>
